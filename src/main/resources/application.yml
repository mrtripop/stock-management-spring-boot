server:
  port: 8080

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
    show-sql: ${JPA_PROPERTIES_SHOW_SQL}
  main:
    web-application-type: servlet
  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_REDIS_TTL}
  data:
    redis:
      url: ${REDIS_URL}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

logging:
  level:
    com:
      mrtripop: ${LOGGING_LEVEL_COM_MRTRIPOP}
    org:
      hibernate: INFO
      springframework:
        security: DEBUG

config:
  author:
    name: Tripop Torcheep
    email: tripop.chai12@gmail.com
  app:
    version: 1.0.0
    local-url: http://localhost:8080
    dev-url: http://dev-inventory.mrtripop-int.com
    stg-url: http://inventory.mrtripop-int.com
    action-queue:
      expiry-warning-days: ${EXPIRY_WARNING_DAYS:30}
      scan-cron: ${ACTION_QUEUE_SCAN_CRON:0 0 6 * * *}
      enabled: ${ACTION_QUEUE_ENABLED:true}
  spotify:
    url: https://spotify23.p.rapidapi.com

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    access-token-expiration: ${AUTH_JWT_ACCESS_TOKEN_EXPIRATION:86400000}
    temp-token-expiration: ${AUTH_JWT_TEMP_TOKEN_EXPIRATION:300000}
  totp:
    issuer: ${AUTH_TOTP_ISSUER:StockManagement}
    digits: 6
    period: 30

stock:
  reconciliation:
    cron: ${STOCK_RECONCILIATION_CRON:0 0 2 * * ?}
    batch-page-size: ${STOCK_RECONCILIATION_BATCH_PAGE_SIZE:100}


